name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # Run 20 minutes after the last uBlue image starts.
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # Let each recipe report its own result.
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@836161eb076426a451e6a0054f722b1153b8b3ad # v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # PRs get no repository secrets (forks) and a read-only token, so
          # they build and validate only. Only default-branch pushes and
          # schedules may publish and sign.
          push: ${{ github.event_name != 'pull_request' }}
          build_opts: ${{ github.event_name == 'pull_request' && '--no-sign' || '' }}

          # Rechunk into content-defined layers for smaller delta updates:
          # the same rpm-ostree build-chunked-oci mechanism, layer cap, and
          # pre-push/sign placement as ublue-os/image-template's ostree-rechunk.
          build_chunked_oci: "true"
          max_layers: "127"

          # Small images can disable this to build faster.
          maximize_build_space: true

          # Retry registry pushes instead of rebuilding the whole image.
          retry_push_count: 3
