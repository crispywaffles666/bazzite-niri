# tuigreet --remember/--remember-session persist login state so the greeter
# can pre-fill the last username/session. Fedora's tuigreet build is patched
# to write /var/lib/greetd/tuigreet-* instead of upstream's
# /var/cache/tuigreet/*. /var is not shipped in ostree images, and Fedora's
# own tmpfiles entry only has a Z line (relabels an existing dir, never
# creates one), so the dir must be created here. SELinux labels this path
# xdm_var_lib_t, which the greeter domain (xdm_t) may manage.
d /var/lib/greetd 0755 greetd greetd -
