# Suspend the machine when it sits idle at the greetd greeter.
#
# logind idle tracking on this system (verified against systemd v259):
# - the tuigreet greeter session is class=greeter, type=tty on vt2, so logind
#   tracks its idle via the tty atime — greeter keystrokes reset the timer;
# - the niri wayland session is graphical, so logind only honors an explicit
#   idle hint, which niri/noctalia never sets: IdleAction can NOT fire while
#   a user is logged in. In-session idle suspend stays with noctalia's
#   [idle.behavior.suspend] (lock_and_suspend at 30min) in the skel config.
# Idle inhibitors (e.g. media playback) also block this action.
[Login]
IdleAction=suspend
IdleActionSec=15min
