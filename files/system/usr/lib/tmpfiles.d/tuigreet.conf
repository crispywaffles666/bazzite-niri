# tuigreet --remember/--remember-session persist login state so the greeter
# can pre-fill the last username/session. Fedora's tuigreet build is patched
# to write /var/lib/greetd/tuigreet-* (the greetd user's home) instead of
# upstream's /var/cache/tuigreet/*. /var is not shipped in the image
# (ostree), and Fedora's own tmpfiles entry (usr/lib/tmpfiles.d/greetd.conf)
# only has a Z line — it relabels an existing dir but never creates one —
# so the dir must be created here at boot, owned by the greetd user
# (created via sysusers.d/greetd.conf). Policy labels it xdm_var_lib_t,
# which the greeter domain (xdm_t) is allowed to manage.
d /var/lib/greetd 0755 greetd greetd -
