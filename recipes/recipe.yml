# Custom image: bazzite-gnome with GNOME stripped, niri + noctalia desktop
# environment layered in.
---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-niri
description: Bazzite with GNOME stripped, niri compositor + noctalia shell (CachyOS parity)

base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: stable

modules:
  # ship everything under files/system: greetd config, /etc/skel dotfiles,
  # tmpfiles drop, gschema override
  - type: files
    files:
      - source: system
        destination: /

  # Phase 1: niri compositor + login manager.
  # xdg-desktop-portal-gnome and gnome-keyring are listed here so dnf marks
  # them user-installed and the GNOME autoremove pass keeps them.
  - type: dnf
    install:
      packages:
        - niri
        - xwayland-satellite
        - greetd
        - tuigreet
        - alacritty
        - xdg-desktop-portal-gnome
        - gnome-keyring
        # keeps nautilus marked user-installed; without this the GNOME
        # removal cascade removes it as an orphan of nautilus-gsconnect
        - nautilus
      exclude:
        # niri Recommends these companions; unused here (noctalia provides
        # bar/launcher/lock screen) and would be dead weight in the image
        - swaylock
        - waybar
        - fuzzel

  # terra ships disabled in bazzite; enable it just for the build
  # (ghostty/satty/yazi/starship live there). brave's first-party rpm repo
  # provides brave-origin. Both are re-disabled at the end.
  - type: script
    snippets:
      - dnf5 config-manager setopt terra.enabled=1
      - dnf5 config-manager addrepo --from-repofile=https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo

  # Phase 2: desktop shell + desktop environment.
  # ghostty/satty/yazi/starship come from terra; everything else is from the
  # official Fedora repos.
  - type: dnf
    install:
      packages:
        # shell + compositor companions
        - noctalia
        - ghostty
        - satty
        - brightnessctl
        - playerctl
        - inotify-tools
        # wl-copy is used by screenshot-notify.sh's Copy action and satty's
        # copy-command; nothing else pulls it in, so make it explicit
        - wl-clipboard
        - pavucontrol
        - cava
        # browser: brave-origin from brave's first-party rpm repo
        - brave-origin
        # power-profiles-daemon deliberately absent: base ships tuned-ppd,
        # which conflicts with it and already serves the same PPD DBus API
        # desktop tools
        - seahorse
        - xterm
        # cli tools (neovim + LSPs deliberately excluded: installed via brew)
        - zsh
        - bat
        - micro
        - geany
        - ripgrep
        - stow
        - yazi
        - starship

  # localsearch (GNOME/tracker indexer) is a hard Requires of nautilus, so it
  # must stay in the image — but its extractor segfaults in a loop on this
  # GNOME-less setup. Mask its user units globally so no session starts the
  # miner pipeline; nautilus falls back to plain filename search. The glob
  # (not fixed unit names) keeps the masks working when a tinysparql ABI bump
  # renames the units (localsearch-3.service -> localsearch-4.service);
  # systemctl mask can't glob, so create the /dev/null symlinks directly.
  - type: script
    snippets:
      - for u in /usr/lib/systemd/user/localsearch*.service; do ln -sf /dev/null "/etc/systemd/user/$(basename "$u")"; done

  # strip the GNOME desktop (keeps xdg-desktop-portal-gnome + gnome-keyring),
  # enable greetd as the display manager, install Overpass Nerd Font
  - type: script
    scripts:
      - remove-gnome.sh
      - setup-greetd.sh
      - install-overpass-nerd.sh

  # Phase 3: plain Overpass (monospace-font-name 'Overpass Mono' in the
  # gschema override refers to the unpatched family)
  - type: dnf
    install:
      packages:
        - overpass-fonts

  # delete GNOME-era gschema overrides shipped by fedora/bazzite — they break
  # --strict compilation: org.gnome.shell / mutter / login-screen reference
  # schemas removed with GNOME, the screensaver override sets picture-uri*
  # keys GNOME 48 dropped, and bazzite's zz0-* files mix valid keys with
  # gnome-software/mutter/shell keys. Then compile with --strict so the build
  # fails on any bad key in the remaining overrides (fedora background +
  # zz_bazzite-niri).
  - type: script
    snippets:
      - rm -f /usr/share/glib-2.0/schemas/00_org.gnome.shell.gschema.override /usr/share/glib-2.0/schemas/org.gnome.shell.gschema.override /usr/share/glib-2.0/schemas/org.gnome.login-screen.gschema.override /usr/share/glib-2.0/schemas/10_org.gnome.desktop.screensaver.fedora.gschema.override /usr/share/glib-2.0/schemas/org.gnome.Ptyxis.fedora.gschema.override /usr/share/glib-2.0/schemas/zz0-0*.gschema.override
      - glib-compile-schemas --strict /usr/share/glib-2.0/schemas

  # restore bazzite's default: terra disabled in the shipped image;
  # brave's repo too (package updates flow through image rebuilds)
  - type: script
    snippets:
      - dnf5 config-manager setopt terra.enabled=0
      - dnf5 config-manager setopt brave-browser.enabled=0

  # Guard against Fedora/Bazzite dependency changes silently restoring the
  # GNOME desktop or removing packages required by the Niri session.
  - type: script
    scripts:
      - validate-package-set.sh
